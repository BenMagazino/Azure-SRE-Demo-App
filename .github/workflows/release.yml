name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tags must use the stable semantic version format vMAJOR.MINOR.PATCH."
          }

          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must identify a commit contained in main."
          }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Run Python tests
        shell: pwsh
        run: python -m unittest discover -s app\tests -p "test_*.py"

      - name: Check JavaScript syntax
        shell: pwsh
        run: node --check app\static\app.js

      - name: Build Windows package
        shell: pwsh
        run: .\scripts\build-windows.ps1

      - name: Create checksum
        shell: pwsh
        run: |
          $archive = "dist\AzureSREAgentDemo-portable-win-x64.zip"
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AzureSREAgentDemo-portable-win-x64.zip" |
            Set-Content -LiteralPath "$archive.sha256" -Encoding ascii

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "dist\AzureSREAgentDemo-portable-win-x64.zip" `
            "dist\AzureSREAgentDemo-portable-win-x64.zip.sha256" `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --generate-notes `
            --title "Azure SRE Agent Demo $env:GITHUB_REF_NAME"
